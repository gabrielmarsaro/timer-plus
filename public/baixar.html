<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Baixar Timer Plus (Android)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #222 0%, #000 55%);
        color: #fff;
      }
      .card {
        width: min(420px, 100%);
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        padding: 28px 22px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 18px;
        color: #bdbdbd;
        line-height: 1.45;
        font-size: 0.95rem;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 16px 18px;
        border-radius: 14px;
        background: #b6ff3c;
        color: #111;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
        font-size: 1.05rem;
      }
      .btn:active { transform: scale(0.98); }
      ol {
        margin: 20px 0 0;
        padding-left: 18px;
        text-align: left;
        color: #cfcfcf;
        line-height: 1.5;
        font-size: 0.9rem;
      }
      code {
        color: #b6ff3c;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>TIMER PLUS</h1>
      <p>Instale no Android sem Play Store. Toque no botão abaixo para baixar o APK.</p>
      <a class="btn" href="./timer-plus-debug.apk" download="timer-plus-debug.apk">
        BAIXAR APK
      </a>
      <ol>
        <li>Toque em <strong>BAIXAR APK</strong>.</li>
        <li>Abra o arquivo baixado.</li>
        <li>Se pedir, permita <strong>fontes desconhecidas</strong> para o Chrome/Arquivos.</li>
        <li>Toque em <strong>Instalar</strong>.</li>
      </ol>
    </main>
  </body>
</html>
